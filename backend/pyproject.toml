[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-knowledge-base"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # Config & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",

    # Vector DB
    "chromadb>=0.5",

    # LangChain / LangGraph
    "langchain>=0.2",
    "langchain-core>=0.2",
    "langchain-community>=0.2",
    "langchain-ollama>=0.1",
    "langchain-openai>=0.1",
    "langgraph>=0.1",

    # Embeddings & reranker
    "sentence-transformers>=3.0",

    # Document parsers
    "pypdf>=4.0",
    "docx2txt>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.7",
    "ragas>=0.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: tests that require real Postgres and ChromaDB",
    "e2e: tests that require the full Docker Compose stack",
    "eval: RAGAS quality evals — require OPENAI_API_KEY and real infrastructure, run manually",
]
